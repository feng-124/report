<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>民间观察鉴定所 · 管理后台</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    font-family:'LXGW WenKai','KaiTi','STKaiti','Kaiti SC','楷体',serif;
    background-color:#faf5e8; color:#3a3322; min-height:100vh; padding-bottom:40px;
  }
  .wrap { max-width:560px; margin:0 auto; padding:20px; }
  h1 { font-size:20px; text-align:center; margin-bottom:4px; letter-spacing:2px; }
  .sub { text-align:center; font-size:12px; color:#a08a5c; margin-bottom:20px; }

  .login-box { background:#fffdf8; border-radius:10px; padding:24px; box-shadow:0 2px 10px rgba(80,60,40,.1); }
  .login-box label { font-size:14px; display:block; margin-bottom:6px; }
  .login-box input {
    width:100%; border:2px solid #dcd2bd; border-radius:8px; padding:10px;
    font-family:inherit; font-size:15px; margin-bottom:14px;
  }
  .btn {
    background:#c0614b; color:#fff; border:none; border-radius:10px; padding:12px;
    font-size:15px; font-family:inherit; cursor:pointer; width:100%; font-weight:bold;
  }
  .btn:active { background:#b05743; }

  .toolbar { display:flex; gap:10px; margin-bottom:16px; }
  .toolbar .btn { flex:1; padding:10px; font-size:13px; }

  .stat { text-align:center; font-size:13px; color:#7a6a48; margin-bottom:16px; }

  .card {
    background:#fffdf8; border-radius:10px; padding:16px; margin-bottom:14px;
    box-shadow:0 1px 6px rgba(80,60,40,.08); position:relative;
  }
  .card .top { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
  .card .obj { font-size:16px; font-weight:bold; }
  .card .rating {
    display:inline-block; width:34px; height:34px; line-height:34px; text-align:center;
    border-radius:50%; color:#fff; font-weight:bold; font-size:16px; flex-shrink:0;
  }
  .card .folk { font-size:13px; color:#c0614b; margin-bottom:6px; }
  .card .line { font-size:13px; line-height:1.6; margin-bottom:3px; }
  .card .line b { color:#7a6a48; }
  .card img { width:100%; max-height:220px; object-fit:cover; border-radius:6px; margin-top:10px; }
  .card .meta { font-size:11px; color:#bfa77a; margin-top:8px; }

  .rating-S { background:#c0392b; }
  .rating-A { background:#e67e22; }
  .rating-B { background:#7f8c8d; }
  .rating-C { background:#2c3e50; }

  .empty { text-align:center; color:#bfa77a; padding:40px 0; font-size:14px; }
  .err { color:#c0392b; font-size:13px; text-align:center; margin-top:10px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>民间观察鉴定所</h1>
  <div class="sub">管理后台 · 查岗专用</div>

  <div class="login-box" id="loginBox">
    <label>管理口令</label>
    <input type="password" id="pwd" placeholder="输入口令">
    <div class="btn" onclick="login()">进入后台</div>
    <div class="err" id="loginErr"></div>
  </div>

  <div id="mainBox" style="display:none;">
    <div class="toolbar">
      <div class="btn" onclick="loadData()">刷新</div>
      <div class="btn" onclick="exportCSV()">导出 CSV</div>
    </div>
    <div class="stat" id="stat"></div>
    <div id="list"></div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://logdxmjmpmewiktwrvxu.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_7G47Obhi24AM6ZWrFCKbnw_wTH912li';
const BUCKET = 'reports';
const ADMIN_PASSWORD = 'jds2026';

let allReports = [];

function login() {
  const pwd = document.getElementById('pwd').value;
  if (pwd === ADMIN_PASSWORD) {
    document.getElementById('loginBox').style.display = 'none';
    document.getElementById('mainBox').style.display = 'block';
    loadData();
  } else {
    document.getElementById('loginErr').textContent = '口令错误';
  }
}

async function loadData() {
  const resp = await fetch(SUPABASE_URL + '/rest/v1/reports?select=*&order=created_at.desc', {
    headers: { apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + SUPABASE_ANON_KEY }
  });
  const data = await resp.json();
  allReports = data || [];
  render();
}

function photoUrl(key) {
  if (!key) return '';
  return SUPABASE_URL + '/storage/v1/object/public/' + BUCKET + '/' + key;
}

function render() {
  const stat = document.getElementById('stat');
  stat.textContent = '共 ' + allReports.length + ' 份档案';
  const list = document.getElementById('list');
  if (!allReports.length) {
    list.innerHTML = '<div class="empty">还没有人提交，坐等上缴</div>';
    return;
  }
  list.innerHTML = allReports.map(r => {
    const img = r.photo_key ? '<img src="' + photoUrl(r.photo_key) + '" loading="lazy">' : '';
    const time = r.created_at ? new Date(r.created_at).toLocaleString('zh-CN') : '';
    return '<div class="card">' +
      '<div class="top"><span class="obj">' + esc(r.object_name) + '</span>' +
      '<span class="rating rating-' + esc(r.rating) + '">' + esc(r.rating) + '</span></div>' +
      '<div class="folk">江湖名：' + esc(r.folk_name) + '</div>' +
      '<div class="line"><b>地理鉴定：</b>' + esc(r.geo_analysis) + '</div>' +
      '<div class="line"><b>政治鉴定：</b>' + esc(r.political_analysis) + '</div>' +
      (r.observer_code ? '<div class="line"><b>代号：</b>' + esc(r.observer_code) + '</div>' : '') +
      img +
      '<div class="meta">' + time + ' · 状态:' + esc(r.status) + '</div>' +
      '</div>';
  }).join('');
}

function esc(s) {
  if (s == null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function exportCSV() {
  if (!allReports.length) { alert('暂无数据'); return; }
  const header = ['对象','民间命名','地理鉴定','政治鉴定','评级','代号','照片链接','时间'];
  const rows = allReports.map(r => [
    r.object_name, r.folk_name, r.geo_analysis, r.political_analysis,
    r.rating, r.observer_code || '', r.photo_key ? photoUrl(r.photo_key) : '', r.created_at || ''
  ]);
  const csv = '\uFEFF' + [header, ...rows].map(row =>
    row.map(c => '"' + String(c == null ? '' : c).replace(/"/g,'""') + '"').join(',')
  ).join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '民间档案_' + new Date().toISOString().slice(0,10) + '.csv';
  a.click();
}
</script>
</body>
</html>
